# Render Blueprint for the API. Secrets are marked sync: false, so Render asks for
# them in the dashboard and they never live in this repository.
services:
  - type: web
    name: dealership-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: BCRYPT_COST
        value: "10"
      - key: CORS_ORIGIN
        sync: false
